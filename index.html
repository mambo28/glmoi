<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0893a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글모이">
<title>글모이 — 글귀 수집</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23e0893a'/%3E%3Cpath d='M176 150c-44 0-80 36-80 80 0 44 36 80 80 80 8 0 16-1 23-4-8 34-33 55-67 61-11 2-18 12-16 23 2 10 11 17 21 16 71-11 116-66 116-146v-30c0-44-36-80-80-80zm160 0c-44 0-80 36-80 80 0 44 36 80 80 80 8 0 16-1 23-4-8 34-33 55-67 61-11 2-18 12-16 23 2 10 11 17 21 16 71-11 116-66 116-146v-30c0-44-36-80-80-80z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23e0893a'/%3E%3Cpath d='M176 150c-44 0-80 36-80 80 0 44 36 80 80 80 8 0 16-1 23-4-8 34-33 55-67 61-11 2-18 12-16 23 2 10 11 17 21 16 71-11 116-66 116-146v-30c0-44-36-80-80-80zm160 0c-44 0-80 36-80 80 0 44 36 80 80 80 8 0 16-1 23-4-8 34-33 55-67 61-11 2-18 12-16 23 2 10 11 17 21 16 71-11 116-66 116-146v-30c0-44-36-80-80-80z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f3ee; --surface:#fff; --surface-2:#efe9e0; --line:#e5ddd1;
  --text:#221d16; --muted:#7a7165; --accent:#c9771f; --accent-weak:#f6e6cf;
  --danger:#cc4433; --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1611; --surface:#241f18; --surface-2:#2d271e; --line:#3a3328;
  --text:#ece5da; --muted:#a79c8b; --accent:#e9a44a; --accent-weak:#3a2e1c;
  --danger:#ff6b5b; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1a1611; --surface:#241f18; --surface-2:#2d271e; --line:#3a3328;
  --text:#ece5da; --muted:#a79c8b; --accent:#e9a44a; --accent-weak:#3a2e1c;
  --danger:#ff6b5b; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px}
header .sub{font-size:12px;color:var(--muted);margin-top:2px}
main{padding:14px 16px;max-width:720px;margin:0 auto}
input,textarea,select,button{font-family:inherit;font-size:16px}
input[type=search],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.btn:active{opacity:.85}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:8px 11px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.actions .btn{flex-direction:column;gap:4px;padding:14px 4px;font-size:13px}
.actions .btn .ic{font-size:22px}
.muted{color:var(--muted)}.small{font-size:13px}.xsmall{font-size:11.5px}.center{text-align:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--accent-weak);color:var(--accent);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.cat-head{font-weight:800;margin:18px 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.cat-head:first-child{margin-top:4px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .q{white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.65}
.item .q::before{content:'“';color:var(--accent);font-weight:800;margin-right:1px}
.item .q::after{content:'”';color:var(--accent);font-weight:800;margin-left:1px}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
label.fl{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s,transform .2s;z-index:50;pointer-events:none;max-width:90%}
.toast.show{opacity:.92;transform:translateX(-50%) translateY(-4px)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:2px 0 10px;font-size:17px}
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:38px;margin:6px auto 4px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,119,31,.5)}70%{box-shadow:0 0 0 18px rgba(201,119,31,0)}100%{box-shadow:0 0 0 0 rgba(201,119,31,0)}}
.live{min-height:70px;background:var(--surface-2);border-radius:12px;padding:12px;margin:10px 0;font-size:15px;line-height:1.6;white-space:pre-wrap}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>
<header>
  <div><h1>글모이</h1><div class="sub">좋은 글귀 · 명언 모음</div></div>
  <button class="btn sec sm" id="menuBtn">⚙️</button>
</header>

<main>
  <div class="actions">
    <button class="btn" id="addBtn"><span class="ic">✍️</span>직접 입력</button>
    <button class="btn sec" id="ocrBtn"><span class="ic">📷</span>사진에서</button>
    <button class="btn sec" id="voiceBtn"><span class="ic">🎤</span>음성</button>
    <input type="file" id="ocrFile" accept="image/*" capture="environment" style="display:none">
  </div>
  <div id="ocrProgress" class="card" style="display:none">
    <div class="small" id="ocrMsg">이미지에서 글자 읽는 중…</div>
    <div class="progress"><div id="ocrBar"></div></div>
  </div>
  <input type="search" id="search" placeholder="글귀 검색" style="margin-bottom:14px">
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return 1}catch(e){toast('저장공간 오류');return 0}},
  raw(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  setRaw(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('복사됨');}catch(e){const i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('복사됨');}catch(_){}i.remove();}}
function openSheet(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show');}
function closeSheet(){$('#modal').classList.remove('show');stopVoice();}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});

/* categories */
const CATS=[
 {name:'인생·삶',kw:['인생','삶','살아','세월','나이','시간','오늘','하루','운명','길']},
 {name:'사랑·관계',kw:['사랑','연인','그대','마음','그리움','이별','사람','우정','친구','가족','곁']},
 {name:'용기·도전',kw:['용기','도전','두려움','시작','꿈','포기','다시','일어','극복','과감']},
 {name:'위로·치유',kw:['위로','괜찮','아픔','슬픔','눈물','쉬어','견디','버티','치유','힘내']},
 {name:'지혜·배움',kw:['지혜','배움','공부','깨달','현명','어리석','진리','생각','깨닫','교훈']},
 {name:'성공·성장',kw:['성공','성장','노력','성취','습관','목표','부자','돈','일','성실','기회']},
 {name:'신앙·명상',kw:['신','하나님','기도','믿음','영혼','마음챙','명상','감사','은혜','평안']},
 {name:'유머·재치',kw:['ㅋㅋ','웃','유머','재치','농담','위트']},
];
function categorize(t){const s=(t||'').toLowerCase();let b=null,bs=0;
  for(const c of CATS){let n=0;for(const k of c.kw)if(s.includes(k.toLowerCase()))n++;if(n>bs){bs=n;b=c.name;}}
  return b||'기타';}
function getNotes(){return LS.get('glg_notes',[]);}
function setNotes(a){LS.set('glg_notes',a);}

function render(){
  const q=($('#search').value||'').toLowerCase().trim();
  let notes=getNotes().slice().sort((a,b)=>b.ts-a.ts);
  if(q)notes=notes.filter(n=>(n.text||'').toLowerCase().includes(q)||(n.cat||'').toLowerCase().includes(q));
  if(!notes.length){$('#list').innerHTML='<div class="empty">아직 모은 글귀가 없어요.<br>✍️ 직접 입력 · 📷 사진 · 🎤 음성으로 담아보세요.</div>';return;}
  const g={};notes.forEach(n=>{(g[n.cat]=g[n.cat]||[]).push(n);});
  const order=[...CATS.map(c=>c.name),'기타'];
  let html='';
  order.filter(c=>g[c]).forEach(c=>{
    html+=`<div class="cat-head"><span class="pill">${esc(c)}</span><span class="xsmall muted">${g[c].length}개</span></div>`;
    g[c].forEach(n=>{const d=new Date(n.ts);
      html+=`<div class="item">
        <div class="q">${esc(n.text)}</div>
        ${n.src?`<div class="xsmall muted" style="margin-top:6px">— ${esc(n.src)}</div>`:''}
        <div class="spread" style="margin-top:10px">
          <span class="xsmall muted">${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}</span>
          <span><button class="btn sm ghost" data-edit="${n.id}">수정</button>
          <button class="btn sm sec" data-copy="${n.id}">복사</button></span>
        </div></div>`;});
  });
  $('#list').innerHTML=html;
}
function noteForm(n){
  n=n||{};const cats=[...CATS.map(c=>c.name),'기타'];
  const auto=n.text?categorize(n.text):'기타';
  openSheet(`<h3>${n.id?'글귀 수정':'글귀 저장'}</h3>
    <label class="fl">내용</label><textarea id="n_text" placeholder="좋은 글귀를 입력하세요">${esc(n.text||'')}</textarea>
    <label class="fl">출처 (선택)</label><input type="search" id="n_src" value="${esc(n.src||'')}" placeholder="책 제목, 저자 등">
    <label class="fl">분류</label>
    <select id="n_cat">${cats.map(c=>`<option ${ (n.cat||auto)===c?'selected':''}>${c}</option>`).join('')}</select>
    <p class="xsmall muted" style="margin:6px 0 0">분류를 안 바꾸면 내용에 맞춰 자동 분류돼요 (추천: <b>${esc(auto)}</b>)</p>
    <div class="row" style="margin-top:14px">
      ${n.id?`<button class="btn danger sm" id="n_del">삭제</button>`:''}
      <div style="flex:1"></div>
      <button class="btn sec sm" id="n_cancel">취소</button>
      <button class="btn sm" id="n_save">저장</button>
    </div>`);
  let touched=!!n.id;
  $('#n_cat').addEventListener('change',()=>touched=true);
  $('#n_text').addEventListener('input',()=>{if(!touched){const a=categorize($('#n_text').value);$('#n_cat').value=a;}});
  $('#n_cancel').onclick=closeSheet;
  if($('#n_del'))$('#n_del').onclick=()=>{if(confirm('이 글귀를 삭제할까요?')){setNotes(getNotes().filter(x=>x.id!==n.id));closeSheet();render();toast('삭제됨');}};
  $('#n_save').onclick=()=>{
    const text=$('#n_text').value.trim();if(!text){toast('내용을 입력하세요');return;}
    const src=$('#n_src').value.trim();const cat=touched?$('#n_cat').value:categorize(text);
    const notes=getNotes();
    if(n.id){const i=notes.findIndex(x=>x.id===n.id);notes[i]={...notes[i],text,src,cat};}
    else notes.push({id:uid(),text,src,cat,ts:Date.now()});
    setNotes(notes);closeSheet();render();toast('저장됨');
  };
  setTimeout(()=>$('#n_text').focus(),120);
}
$('#addBtn').onclick=()=>noteForm();
$('#search').addEventListener('input',render);
$('#list').addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){noteForm(getNotes().find(x=>x.id===ed.dataset.edit));return;}
  const cp=e.target.closest('[data-copy]');if(cp){const n=getNotes().find(x=>x.id===cp.dataset.copy);copy(n.text+(n.src?'\n— '+n.src:''));return;}
});

/* OCR */
$('#ocrBtn').onclick=()=>$('#ocrFile').click();
$('#ocrFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(typeof Tesseract==='undefined'){toast('글자인식 모듈 로딩 실패(인터넷 확인)');return;}
  $('#ocrProgress').style.display='block';$('#ocrBar').style.width='0%';$('#ocrMsg').textContent='준비 중… (처음엔 한국어 데이터 받느라 느릴 수 있어요)';
  try{
    const {data:{text}}=await Tesseract.recognize(f,'kor+eng',{logger:m=>{
      if(m.status==='recognizing text'){$('#ocrBar').style.width=Math.round(m.progress*100)+'%';$('#ocrMsg').textContent='글자 읽는 중… '+Math.round(m.progress*100)+'%';}
      else $('#ocrMsg').textContent=m.status;}});
    $('#ocrProgress').style.display='none';
    const clean=(text||'').replace(/\n{3,}/g,'\n\n').trim();
    if(!clean){toast('글자를 못 찾았어요');return;}
    noteForm({text:clean});
  }catch(err){$('#ocrProgress').style.display='none';toast('인식 실패: '+(err.message||err));}
});

/* VOICE */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recording=false,voiceFinal='';
function voiceSheet(){
  openSheet(`<h3>음성으로 입력</h3>
    <div class="center">
      <button class="mic" id="micBtn">🎤</button>
      <div class="small muted" id="micHint">버튼을 누르고 말하세요</div>
    </div>
    <div class="live" id="liveText"></div>
    <div class="row" style="margin-top:4px">
      <button class="btn sec sm" id="v_cancel">취소</button>
      <div style="flex:1"></div>
      <button class="btn sm" id="v_use" disabled>이 내용 저장</button>
    </div>
    <p class="xsmall muted" style="margin-top:10px">말이 끝나면 “이 내용 저장”을 눌러 분류·수정 후 저장해요. 마이크 권한을 허용해야 해요.</p>`);
  voiceFinal='';
  $('#v_cancel').onclick=closeSheet;
  $('#micBtn').onclick=()=>recording?stopVoice():startVoice();
  $('#v_use').onclick=()=>{const t=voiceFinal.trim();stopVoice();closeSheet();if(t)noteForm({text:t});};
}
function updateVoiceUI(t){$('#liveText').textContent=t||'';$('#v_use').disabled=!t.trim();}
function startVoice(){
  if(!SR){toast('이 브라우저는 음성입력을 지원하지 않아요 (크롬 권장)');return;}
  try{
    rec=new SR();rec.lang='ko-KR';rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const tr=e.results[i][0].transcript;if(e.results[i].isFinal)voiceFinal+=tr;else interim+=tr;}updateVoiceUI(voiceFinal+interim);};
    rec.onerror=ev=>{recording=false;const b=$('#micBtn');if(b)b.classList.remove('rec');
      const msg={'not-allowed':'마이크 권한이 거부됐어요','service-not-allowed':'마이크 권한이 거부됐어요','no-speech':'말소리가 안 들렸어요','network':'네트워크 필요(인터넷 확인)','audio-capture':'마이크를 찾을 수 없어요'}[ev.error]||('오류: '+ev.error);
      const h=$('#micHint');if(h)h.textContent=msg;toast(msg);};
    rec.onend=()=>{if(recording){try{rec.start();}catch(e){recording=false;const b=$('#micBtn');if(b)b.classList.remove('rec');}}};
    rec.start();recording=true;
    $('#micBtn').classList.add('rec');$('#micHint').textContent='듣는 중… 다시 누르면 멈춤';
  }catch(e){toast('음성입력 시작 실패');}
}
function stopVoice(){recording=false;if(rec){try{rec.stop();}catch(e){}rec=null;}const b=$('#micBtn');if(b)b.classList.remove('rec');const h=$('#micHint');if(h)h.textContent='멈춤';}
$('#voiceBtn').onclick=()=>{ if(!SR){toast('이 브라우저는 음성입력 미지원 — 크롬에서 열어주세요');return;} voiceSheet(); };

/* MENU: 테마·백업 */
function menuSheet(){
  openSheet(`<h3>설정</h3>
    <div class="card"><div class="spread"><b>테마</b>
      <div class="row">
        <button class="btn sm sec" data-th="">자동</button>
        <button class="btn sm sec" data-th="light">밝게</button>
        <button class="btn sm sec" data-th="dark">어둡게</button>
      </div></div></div>
    <div class="card"><b>백업 / 복원</b>
      <p class="small muted" style="margin:6px 0 10px">글귀는 이 폰 브라우저에만 저장돼요. 가끔 백업하세요.</p>
      <div class="row wrap">
        <button class="btn sm sec" id="bk">⬇ 백업</button>
        <button class="btn sm sec" id="rs">⬆ 복원</button>
        <button class="btn sm sec" id="tx">📄 전체 텍스트로</button>
        <input type="file" id="rsf" accept="application/json,.json" style="display:none">
      </div></div>
    <div class="card"><b>홈 화면에 추가</b>
      <p class="small muted" style="margin:6px 0 0">브라우저 메뉴 → “홈 화면에 추가”를 누르면 앱 아이콘이 생기고 바로 실행돼요.</p></div>
    <button class="btn sec block" id="m_close" style="margin-top:6px">닫기</button>`);
  $$('[data-th]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.th);toast('테마 변경');});
  $('#m_close').onclick=closeSheet;
  $('#bk').onclick=()=>{const blob=new Blob([JSON.stringify({_app:'glg',_v:1,ts:Date.now(),notes:getNotes()})],{type:'application/json'});
    const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='글모이-백업-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('백업 저장됨');};
  $('#rs').onclick=()=>$('#rsf').click();
  $('#rsf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d._app!=='glg')throw 0;if(!confirm('현재 글귀를 백업으로 덮어쓸까요?'))return;setNotes(d.notes||[]);render();toast('복원 완료');closeSheet();}catch(_){toast('백업 파일이 아니에요');}};r.readAsText(f);});
  $('#tx').onclick=()=>{const notes=getNotes().slice().sort((a,b)=>b.ts-a.ts);
    const g={};notes.forEach(n=>{(g[n.cat]=g[n.cat]||[]).push(n);});
    let out='';[...CATS.map(c=>c.name),'기타'].filter(c=>g[c]).forEach(c=>{out+='【'+c+'】\n';g[c].forEach(n=>{out+='· '+n.text+(n.src?' ('+n.src+')':'')+'\n';});out+='\n';});
    const blob=new Blob([out||'(비어있음)'],{type:'text/plain'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='글모이.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);};
}
$('#menuBtn').onclick=menuSheet;
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');LS.setRaw('glg_theme',t||'');}

/* init */
applyTheme(LS.raw('glg_theme','')||'');
render();
</script>
</body>
</html>
